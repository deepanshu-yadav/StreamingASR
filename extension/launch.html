<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starting Companion Orchestrator — Voice Assistant</title>
    <style>
        body {
            background-color: #0c0e14;
            color: #f0f3fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 16px;
        }
        .card {
            background: #141721;
            border: 1px solid #2b3247;
            border-radius: 12px;
            padding: 36px 28px;
            max-width: 480px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 16px;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        h1 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #f0f3fc;
        }
        p {
            font-size: 13px;
            color: #9aa5c4;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .status-box {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 13px;
            color: #93c5fd;
            margin-bottom: 20px;
        }
        .status-box.success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }
        .btn {
            cursor: pointer;
            background: #10b981;
            color: white;
            border: none;
            padding: 11px 24px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #059669;
        }
        .hint {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid #2b3247;
            padding-top: 14px;
        }
        kbd {
            background: #1e2433;
            border: 1px solid #3b4256;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11px;
            font-family: monospace;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" id="statusIcon">⚡</div>
        <h1 id="titleText" data-i18n="launchTitle">Starting Companion Orchestrator...</h1>
        <p id="descText" data-i18n="launchDesc">
            If a browser dialog asks to <b>"Open Companion Orchestrator"</b>, please select <b>"Open"</b>.
        </p>

        <div class="status-box" id="statusBox" data-i18n="launchStatusWaiting">
            ⏳ Waiting to connect with companion server…
        </div>

        <a id="manualLaunchLink" class="btn" href="voice-companion://start" data-i18n="launchManualBtn">
            🚀 Click here if it does not open automatically
        </a>

        <div class="hint" id="hintText" data-i18n="launchHint">
            If nothing happens, please ensure <kbd>register_protocol.bat</kbd> has been run once.
        </div>
    </div>

    <script src="locales/hi.js"></script>
    <script src="locales/en.js"></script>
    <script src="locales/es.js"></script>
    <script src="locales/fr.js"></script>
    <script src="locales/it.js"></script>
    <script src="locales/pt.js"></script>
    <script src="locales/nl.js"></script>
    <script src="locales/de.js"></script>
    <script src="locales/tr.js"></script>
    <script src="locales/ru.js"></script>
    <script src="locales/ar.js"></script>
    <script src="locales/ja.js"></script>
    <script src="locales/ko.js"></script>
    <script src="locales/vi.js"></script>
    <script src="locales/uk.js"></script>
    <script src="i18n.js"></script>
    <script src="launch.js"></script>
</body>
</html>
