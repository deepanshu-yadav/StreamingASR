<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>सैंपल रजिस्ट्रेशन फ़ॉर्म (Sample Test Form)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.25);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #cbd5e1;
        }
        label span.req {
            color: #ef4444;
            margin-left: 2px;
        }
        input, textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>सदस्यता पंजीकरण (Registration Form)</h1>
        <p class="subtitle">यह पेज Voice ASR & Form Assistant Chrome Extension की फ़ील्ड स्कैनिंग और भरने की जाँच के लिए है।</p>

        <form id="registrationForm" onsubmit="event.preventDefault(); alert('फ़ॉर्म सबमिट हुआ!');">
            <div class="form-group">
                <label for="fullName">पूरा नाम (Full Name)<span class="req">*</span></label>
                <input type="text" id="fullName" name="fullName" placeholder="उदा. राहुल शर्मा" required />
            </div>

            <div class="form-group">
                <label for="email">ईमेल पता (Email Address)<span class="req">*</span></label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required />
            </div>

            <div class="form-group">
                <label for="phone">मोबाइल नंबर (Phone Number)</label>
                <input type="tel" id="phone" name="phone" placeholder="9876543210" />
            </div>

            <div class="form-group">
                <label for="aadhaarNo">आधार संख्या (Aadhaar Number)<span class="req">*</span></label>
                <input type="password" id="aadhaarNo" name="aadhaarNo" placeholder="12 अंकों का आधार नंबर" maxlength="12" required />
            </div>

            <div class="form-group">
                <label for="state">राज्य (State)<span class="req">*</span></label>
                <select id="state" name="state" required style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:#0f172a;color:var(--text);font-size:14px;outline:none;">
                    <option value="">-- राज्य चुनें (Select State) --</option>
                    <option value="UP">उत्तर प्रदेश (Uttar Pradesh)</option>
                    <option value="MH">महाराष्ट्र (Maharashtra)</option>
                    <option value="DL">दिल्ली (Delhi)</option>
                    <option value="BR">बिहार (Bihar)</option>
                    <option value="RJ">राजस्थान (Rajasthan)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="city">शहर का नाम (City)</label>
                <input type="text" id="city" name="city" placeholder="उदा. नई दिल्ली" />
            </div>

            <div class="form-group">
                <label for="notes">अतिरिक्त विवरण या टिप्पणी (Notes / Comments)</label>
                <textarea id="notes" name="notes" placeholder="यहाँ अपनी आवश्यकता या विवरण लिखें…"></textarea>
            </div>

            <button type="submit" class="btn-submit">सबमिट करें (Submit)</button>
        </form>
    </div>
</body>
</html>
